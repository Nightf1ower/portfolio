<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio website for Yaroslav, a graphic designer working with posters, covers, merch, logos, and AI visuals."
    />
    <title>Yaroslav — Graphic Designer</title>
    <link rel="stylesheet" href="/card-overrides.css" />
    <style>
      .blandetto-card:not(.blandetto-card--has-hover):hover .blandetto-card__img--main { opacity: 1 !important; }
      .blandetto-card:not(.blandetto-card--has-hover) .blandetto-card__img--hover { display: none !important; }
      .blandetto-card--has-hover:hover .blandetto-card__img--main { opacity: 0 !important; }
      .blandetto-card--has-hover:hover .blandetto-card__img--hover { opacity: 1 !important; }
      .blandetto-grid--cap .blandetto-card:hover .blandetto-card__img--main { opacity: 1 !important; }
      .blandetto-cap-reference__caption { box-sizing: border-box !important; padding-left: 1rem !important; padding-right: 1rem !important; max-width: 100% !important; }
      .blandetto-lightbox__nav { position: absolute; top: 50%; z-index: 3; width: 3.5rem; height: 3.5rem; transform: translateY(-50%); border: 1px solid #fff; background: #fff; color: #050505; font-size: 2rem; font-weight: 900; line-height: 1; }
      .blandetto-lightbox__nav--prev { left: 1rem; }
      .blandetto-lightbox__nav--next { right: 1rem; }
      .blandetto-lightbox__counter { position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); margin: 0; background: #fff; color: #050505; padding: 0.45rem 0.75rem; font-size: 0.68rem; font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase; }
      .blandetto-grid--dentist { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
      .blandetto-grid--dentist > *:nth-child(1) { grid-column: 1 !important; grid-row: 1 !important; }
      .blandetto-grid--dentist > *:nth-child(3) { grid-column: 2 !important; grid-row: 1 !important; }
      .blandetto-grid--dentist > *:nth-child(2) { grid-column: 3 !important; grid-row: 1 !important; }
      .blandetto-grid--dentist > *:nth-child(5) { grid-column: 1 !important; grid-row: 2 !important; }
      .blandetto-grid--dentist > *:nth-child(4) { grid-column: 2 !important; grid-row: 2 !important; }
      .blandetto-grid--dentist > *:nth-child(6) { grid-column: 3 !important; grid-row: 2 !important; }
      @media (max-width: 900px) { .blandetto-grid--dentist { grid-template-columns: 1fr !important; } .blandetto-grid--dentist > * { grid-column: auto !important; grid-row: auto !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        let logo = null;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;
        let animationFrame = null;
        const radius = 430;
        const maxMove = 30;

        const getLogo = () => {
          if (!logo || !document.body.contains(logo)) {
            logo = document.querySelector('#top h1');
          }
          return logo;
        };

        const setLogoPosition = () => {
          const element = getLogo();
          if (!element) return;
          element.style.setProperty('--logo-x', `${currentX.toFixed(2)}px`);
          element.style.setProperty('--logo-y', `${currentY.toFixed(2)}px`);
        };

        const animate = () => {
          currentX += (targetX - currentX) * 0.16;
          currentY += (targetY - currentY) * 0.16;
          setLogoPosition();

          if (Math.abs(targetX - currentX) > 0.08 || Math.abs(targetY - currentY) > 0.08) {
            animationFrame = requestAnimationFrame(animate);
          } else {
            currentX = targetX;
            currentY = targetY;
            setLogoPosition();
            animationFrame = null;
          }
        };

        const startAnimation = () => {
          if (!animationFrame) animationFrame = requestAnimationFrame(animate);
        };

        const reset = () => {
          targetX = 0;
          targetY = 0;
          startAnimation();
        };

        window.addEventListener('mousemove', (event) => {
          if (window.innerWidth < 769) {
            reset();
            return;
          }

          const element = getLogo();
          if (!element) return;

          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const dx = centerX - event.clientX;
          const dy = centerY - event.clientY;
          const distance = Math.hypot(dx, dy);

          if (distance > radius || distance === 0) {
            targetX = 0;
            targetY = 0;
          } else {
            const force = 1 - distance / radius;
            targetX = (dx / distance) * maxMove * force;
            targetY = (dy / distance) * maxMove * force;
          }

          startAnimation();
        }, { passive: true });

        window.addEventListener('mouseleave', reset);
        window.addEventListener('blur', reset);
      })();

      (() => {
        const enhancePinkPunkGallery = () => {
          const gallery = document.querySelector('.pink-punk-gallery');
          if (!gallery || gallery.dataset.grouped === 'true') return;

          const cards = Array.from(gallery.querySelectorAll(':scope > .pink-punk-frame'));
          if (cards.length < 7) return;

          const makeSection = ({ title, count, note, modifier }) => {
            const section = document.createElement('section');
            section.className = `pink-punk-section pink-punk-section--${modifier}`;

            const head = document.createElement('div');
            head.className = 'pink-punk-section__head';

            const h3 = document.createElement('h3');
            h3.className = 'pink-punk-section__title';
            h3.textContent = title;

            const counter = document.createElement('p');
            counter.className = 'pink-punk-section__counter';
            counter.textContent = count;

            head.append(h3, counter);
            section.append(head);

            if (note) {
              const p = document.createElement('p');
              p.className = 'pink-punk-section__note';
              p.textContent = note;
              section.append(p);
            }

            const grid = document.createElement('div');
            grid.className = `pink-punk-section__grid pink-punk-section__grid--${modifier}`;
            section.append(grid);

            return { section, grid };
          };

          const tees = makeSection({
            title: 'T-SHIRTS',
            count: '3 / 3',
            note: 'Flat print previews first. Hover over a card to see the same graphic worn on body.',
            modifier: 'tees',
          });

          const posters = makeSection({
            title: 'POSTERS',
            count: '3 / 3',
            note: 'Poster artworks and layout experiments for the Pink Punk visual system.',
            modifier: 'posters',
          });

          const printCount = Math.max(cards.length - 6, 0);
          const prints = makeSection({
            title: 'PRINTS',
            count: `${printCount} / ${printCount}`,
            note: 'Standalone print graphics and additional visual system elements.',
            modifier: 'prints',
          });

          cards.slice(0, 3).forEach((card) => tees.grid.append(card));
          cards.slice(3, 6).forEach((card) => posters.grid.append(card));
          cards.slice(6).forEach((card) => prints.grid.append(card));

          gallery.textContent = '';
          gallery.dataset.grouped = 'true';
          gallery.append(tees.section, posters.section, prints.section);
        };

        const observer = new MutationObserver(enhancePinkPunkGallery);
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('load', enhancePinkPunkGallery);
      })();
    </script>
    <script src="/blandetto-gallery.js"></script>
    <script src="/blandetto-static.js"></script>
    <script src="/stayugly-gallery-v5.js?v=stayugly-10"></script>
    <script>
      (() => {
        const fixedCaption = '\u0437\u0430 \u043e\u0441\u043d\u043e\u0432\u0443 \u0432\u0437\u044f\u0442 \u044d\u0442\u043e\u0442 \u043b\u043e\u0433\u043e\u0442\u0438\u043f';
        const applyCaptionFix = () => {
          document.querySelectorAll('.blandetto-cap-reference__caption').forEach((caption) => {
            caption.textContent = fixedCaption;
          });
        };
        const observer = new MutationObserver(applyCaptionFix);
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('load', applyCaptionFix);
        applyCaptionFix();
      })();
    </script>
  </body>
</html>
