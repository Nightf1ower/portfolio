      .blandetto-card:not(.blandetto-card--has-hover):hover .blandetto-card__img--main { opacity: 1 !important; }
      .blandetto-card:not(.blandetto-card--has-hover) .blandetto-card__img--hover { display: none !important; }
      .blandetto-card--has-hover:hover .blandetto-card__img--main { opacity: 0 !important; }
      .blandetto-card--has-hover:hover .blandetto-card__img--hover { opacity: 1 !important; }
      .blandetto-grid--cap .blandetto-card:hover .blandetto-card__img--main { opacity: 1 !important; }
      .blandetto-cap-reference__caption { box-sizing: border-box !important; padding-left: 1rem !important; padding-right: 1rem !important; max-width: 100% !important; }
      .blandetto-lightbox__nav { position: absolute; top: 50%; z-index: 3; width: 3.5rem; height: 3.5rem; transform: translateY(-50%); border: 1px solid #fff; background: #fff; color: #050505; font-size: 2rem; font-weight: 900; line-height: 1; }
      .blandetto-lightbox__nav--prev { left: 1rem; }
      .blandetto-lightbox__nav--next { right: 1rem; }
      .blandetto-lightbox__counter { position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); margin: 0; background: #fff; color: #050505; padding: 0.45rem 0.75rem; font-size: 0.68rem; font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase; }
      .blandetto-grid--dentist { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
      .blandetto-grid--dentist > *:nth-child(1) { grid-column: 1 !important; grid-row: 1 !important; }
      .blandetto-grid--dentist > *:nth-child(3) { grid-column: 2 !important; grid-row: 1 !important; }
      .blandetto-grid--dentist > *:nth-child(2) { grid-column: 3 !important; grid-row: 1 !important; }
      .blandetto-grid--dentist > *:nth-child(5) { grid-column: 1 !important; grid-row: 2 !important; }
      .blandetto-grid--dentist > *:nth-child(4) { grid-column: 2 !important; grid-row: 2 !important; }
      .blandetto-grid--dentist > *:nth-child(6) { grid-column: 3 !important; grid-row: 2 !important; }
      @media (max-width: 900px) {
        .blandetto-grid--dentist { grid-template-columns: 1fr !important; }
        .blandetto-grid--dentist > * { grid-column: auto !important; grid-row: auto !important; }
      }
    </style>

    <script>
      (() => {
        let logo = null;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;
        let animationFrame = null;
        const radius = 430;
        const maxMove = 30;

        const getLogo = () => {
          if (!logo || !document.body.contains(logo)) logo = document.querySelector('#top h1');
          return logo;
        };

        const setLogoPosition = () => {
          const element = getLogo();
          if (!element) return;
          element.style.setProperty('--logo-x', `${currentX.toFixed(2)}px`);
          element.style.setProperty('--logo-y', `${currentY.toFixed(2)}px`);
        };

        const animate = () => {
          currentX += (targetX - currentX) * 0.16;
          currentY += (targetY - currentY) * 0.16;
          setLogoPosition();

          if (Math.abs(targetX - currentX) > 0.08 || Math.abs(targetY - currentY) > 0.08) {
            animationFrame = requestAnimationFrame(animate);
          } else {
            currentX = targetX;
            currentY = targetY;
            setLogoPosition();
            animationFrame = null;
          }
        };

        const startAnimation = () => {
          if (!animationFrame) animationFrame = requestAnimationFrame(animate);
        };

        const reset = () => {
          targetX = 0;
          targetY = 0;
          startAnimation();
        };

        window.addEventListener('mousemove', (event) => {
          if (window.innerWidth < 769) {
            reset();
            return;
          }

          const element = getLogo();
          if (!element) return;

          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const dx = centerX - event.clientX;
          const dy = centerY - event.clientY;
          const distance = Math.hypot(dx, dy);

          if (distance > radius || distance === 0) {
            targetX = 0;
            targetY = 0;
          } else {
            const force = 1 - distance / radius;
            targetX = (dx / distance) * maxMove * force;
            targetY = (dy / distance) * maxMove * force;
          }

          startAnimation();
        }, { passive: true });

        window.addEventListener('mouseleave', reset);
        window.addEventListener('blur', reset);
      })();

      (() => {
        const fixedCaption = 'за основу взят этот логотип';
        const applyCaptionFix = () => {
          document.querySelectorAll('.blandetto-cap-reference__caption').forEach((caption) => {
            if (caption.textContent !== fixedCaption) caption.textContent = fixedCaption;
          });
        };

        let scheduled = false;
        const scheduleCaptionFix = () => {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            applyCaptionFix();
          });
        };

        document.addEventListener('click', (event) => {
          const card = event.target.closest('#works article, #works button');
          if (!card) return;
          const title = card.querySelector('h3')?.textContent?.trim().toUpperCase();
          if (title !== 'BLANDETTO') return;
          setTimeout(scheduleCaptionFix, 0);
          setTimeout(scheduleCaptionFix, 120);
        }, true);
        window.addEventListener('load', scheduleCaptionFix);
      })();
    </script>
