    <script>
      (() => {
        let logo = null, targetX = 0, targetY = 0, currentX = 0, currentY = 0, animationFrame = null;
        const radius = 430, maxMove = 30;
        const getLogo = () => { if (!logo || !document.body.contains(logo)) logo = document.querySelector('#top h1'); return logo; };
        const setLogoPosition = () => { const element = getLogo(); if (!element) return; element.style.setProperty('--logo-x', `${currentX.toFixed(2)}px`); element.style.setProperty('--logo-y', `${currentY.toFixed(2)}px`); };
        const animate = () => { currentX += (targetX - currentX) * 0.16; currentY += (targetY - currentY) * 0.16; setLogoPosition(); if (Math.abs(targetX - currentX) > 0.08 || Math.abs(targetY - currentY) > 0.08) animationFrame = requestAnimationFrame(animate); else { currentX = targetX; currentY = targetY; setLogoPosition(); animationFrame = null; } };
        const startAnimation = () => { if (!animationFrame) animationFrame = requestAnimationFrame(animate); };
        const reset = () => { targetX = 0; targetY = 0; startAnimation(); };
        window.addEventListener('mousemove', (event) => {
          if (window.innerWidth < 769) { reset(); return; }
          const element = getLogo(); if (!element) return;
          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2, centerY = rect.top + rect.height / 2;
          const dx = centerX - event.clientX, dy = centerY - event.clientY, distance = Math.hypot(dx, dy);
          if (distance > radius || distance === 0) { targetX = 0; targetY = 0; }
          else { const force = 1 - distance / radius; targetX = (dx / distance) * maxMove * force; targetY = (dy / distance) * maxMove * force; }
          startAnimation();
        }, { passive: true });
        window.addEventListener('mouseleave', reset); window.addEventListener('blur', reset);
      })();
      (() => {
        const fixedCaption = 'за основу взят этот логотип';
        const applyCaptionFix = () => document.querySelectorAll('.blandetto-cap-reference__caption').forEach((caption) => { if (caption.textContent !== fixedCaption) caption.textContent = fixedCaption; });
        let scheduled = false;
        const scheduleCaptionFix = () => { if (scheduled) return; scheduled = true; requestAnimationFrame(() => { scheduled = false; applyCaptionFix(); }); };
        document.addEventListener('click', (event) => { const card = event.target.closest('#works article, #works button'); if (!card) return; const title = card.querySelector('h3')?.textContent?.trim().toUpperCase(); if (title !== 'BLANDETTO') return; setTimeout(scheduleCaptionFix, 0); setTimeout(scheduleCaptionFix, 120); }, true);
        window.addEventListener('load', scheduleCaptionFix);
      })();
    </script>
